# Публикация на PyPI по GitHub Release.
#
# Запускается вручную: GitHub → Releases → Create a new release → Publish.
# Никаких токенов: авторизацию делает GitHub через OIDC.
#
# Чтобы зарегистрировать этот workflow на PyPI:
#   https://pypi.org/manage/account/publishing/
#   Owner:            winchanii
#   Repository name:  TgWsApiProxy
#   Workflow name:    publish.yml
#   Environment name: pypi
#
# Имя на PyPI необратимо: публикуешь один раз — вернуть нельзя.
# Сначала проверь, что свободно: https://pypi.org/project/tgwsapiproxy/
# (404 = свободно).

name: publish

on:
  release:
    types: [published]

jobs:
  pypi:
    name: build и публикация на PyPI
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/project/tgwsapiproxy/

    permissions:
      # ОБЯЗАТЕЛЬНО для Trusted Publishing: без этого workflow
      # не сможет представиться PyPI
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Сборка
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Проверка метаданных
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*
          ls -l dist/

      - name: Публикация
        uses: pypa/gh-action-pypi-publish@release/v1
